<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduVac Pro - Onboarding Professeur</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: { DEFAULT: '#4f46e5', hover: '#4338ca' } } } }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="js/toast.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <div class="max-w-3xl mx-auto py-12 px-4 sm:px-6">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Complétez votre profil Professeur</h1>
            <p class="text-center text-gray-500 mb-8">Fournissez ces détails pour apparaître dans les recherches des recruteurs.</p>
            
            <form id="onboardingForm" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Ville -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ville de résidence</label>
                        <input type="text" id="city" required placeholder="Ex: Paris" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-primary focus:border-primary shadow-sm bg-gray-50">
                    </div>

                    <!-- Niveau d'études -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Niveau d'études / Diplôme</label>
                        <select id="diploma" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-primary focus:border-primary shadow-sm bg-gray-50">
                            <option value="">Sélectionnez un niveau</option>
                            <option value="Bac+3">Licence (Bac+3)</option>
                            <option value="Bac+4">Master 1 (Bac+4)</option>
                            <option value="Bac+5">Master 2 / Ingénieur (Bac+5)</option>
                            <option value="Doctorat">Doctorat (Bac+8)</option>
                        </select>
                    </div>
                </div>

                <!-- Spécialités -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Spécialités (Matières enseignées)</label>
                    <input type="text" id="specialties" required placeholder="Ex: Mathématiques, Physique, Informatique..." class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-primary focus:border-primary shadow-sm bg-gray-50">
                </div>

                <!-- Upload de CV (Stricte 2Mo max + PDF) -->
                <div>
                    <label class="block text-sm font-medium text-gray-900 mb-2">Upload de votre CV</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition">
                        <input type="file" id="cvFile" accept=".pdf" class="block w-full max-w-xs mx-auto text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-primary hover:file:bg-indigo-100 transition cursor-pointer">
                        <p class="text-xs text-gray-400 mt-2">PDF uniquement, 2 Mo maximum.</p>
                        <p id="fileError" class="text-red-500 text-sm mt-2 hidden"></p>
                    </div>
                </div>

                <!-- Disponibilités -->
                <div>
                    <h3 class="text-sm font-medium text-gray-900 mb-3 border-b pb-2">Vos disponibilités typiques</h3>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="availabilitiesContainer">
                        <!-- Généré en JS -->
                    </div>
                </div>

                <div id="globalError" class="text-red-500 text-sm hidden text-center bg-red-50 p-3 rounded"></div>

                <button type="submit" id="submitBtn" class="w-full bg-primary text-white py-3 rounded-lg font-medium hover:bg-indigo-600 transition shadow flex justify-center items-center">
                    Enregistrer et continuer
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        const supabaseUrl = 'https://anjyvyghdkdhaajhjwlt.supabase.co';
        const supabaseAnonKey = 'sb_publishable_zi_3bUmD4wNd-aAmRNrhew_Cd6gzblL';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        const days = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi'];
        const container = document.getElementById('availabilitiesContainer');
        
        days.forEach(day => {
            container.innerHTML += `
                <div class="border border-gray-100 p-3 rounded-xl bg-gray-50 flex flex-col space-y-2">
                    <p class="font-semibold capitalize text-gray-800 text-sm">${day}</p>
                    <label class="flex items-center space-x-2 text-xs text-gray-600 cursor-pointer hover:text-primary">
                        <input type="checkbox" class="text-primary focus:ring-primary rounded" data-day="${day}" data-time="matin"> <span>Matin</span>
                    </label>
                    <label class="flex items-center space-x-2 text-xs text-gray-600 cursor-pointer hover:text-primary">
                        <input type="checkbox" class="text-primary focus:ring-primary rounded" data-day="${day}" data-time="apres_midi"> <span>A-Midi</span>
                    </label>
                </div>
            `;
        });

        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const fileError = document.getElementById('fileError');
            const globalError = document.getElementById('globalError');
            
            btn.disabled = true;
            btn.innerHTML = 'Enregistrement...';
            fileError.classList.add('hidden');
            globalError.classList.add('hidden');

            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // 1. Validation du CV
                const fileInput = document.getElementById('cvFile');
                if (!fileInput.files.length) throw new Error("Veuillez uploader votre CV.");
                const file = fileInput.files[0];
                
                if (file.type !== 'application/pdf') throw new Error("Le fichier doit obligatoirement être un PDF.");
                if (file.size > 2 * 1024 * 1024) throw new Error("Le fichier dépasse la limite de 2 Mo.");

                // 2. Upload sur Supabase Storage (Bucket 'cvs')
                // Le nom du fichier DOIT commencer par l'user.id à cause des règles RLS !
                const filePath = `${user.id}/${Date.now()}_cv.pdf`;
                const { error: uploadError } = await supabase.storage.from('cvs').upload(filePath, file);
                
                if (uploadError) throw new Error("Erreur d'upload: " + uploadError.message);

                // Optionnel: stocker le chemin dans la DB pour l'accès futur
                const cvUrl = filePath; 

                // 3. Mise à jour de Profiles (Ville)
                const city = document.getElementById('city').value;
                await supabase.from('profiles').update({ city }).eq('id', user.id);

                // 4. Mise à jour de Teacher Details (Diplôme, CV env)
                const diploma = document.getElementById('diploma').value;
                const specialties = document.getElementById('specialties').value;
                await supabase.from('teacher_details').upsert({
                    id: user.id,
                    diploma: diploma,
                    cv_url: cvUrl,
                    specialties: specialties
                });

                // 5. Enregistrement des Disponibilités
                const insertions = [];
                days.forEach(day => {
                    const matin = document.querySelector(`input[data-day="${day}"][data-time="matin"]`).checked;
                    const apres_midi = document.querySelector(`input[data-day="${day}"][data-time="apres_midi"]`).checked;
                    if (matin || apres_midi) {
                        insertions.push({ teacher_id: user.id, jour_semaine: day, matin, apres_midi });
                    }
                });

                if (insertions.length > 0) {
                    await supabase.from('availabilities').upsert(insertions, { onConflict: 'teacher_id, jour_semaine' });
                }

                alert("Votre profil a été complété avec succès !");
                // Redirection vers le dashboard pour voir les offres (Mode Démo fluide)
                window.location.href = 'dashboard_teacher.html';

            } catch (err) {
                globalError.textContent = err.message;
                globalError.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Enregistrer et continuer';
            }
        });
    </script>
</body>
</html>
